# How long a browser may keep each page without asking again.
# Today's cards change every few seconds and must be revalidated on every
# fetch (a 304 is a few hundred bytes now that unchanged files keep their
# modification time). A season that is over cannot change: its day pages,
# game pages and cards are cached for a year. Add the finished year here
# each winter; a year left out is merely revalidated, never wrongly cached.
map $uri $lbs_cache {
    default                                            "no-cache";
    ~^/(19[5-9][0-9]|200[0-9]|201[0-9]|202[0-5])-[0-9][0-9]-[0-9][0-9]  "public, max-age=31536000, immutable";
    ~^/team_logos/                                     "public, max-age=604800";
}
